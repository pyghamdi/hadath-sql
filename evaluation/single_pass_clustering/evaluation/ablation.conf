# Ablation of the HadathSQL driver, ABLATION.md (read by sweep.sh; the default
# config). Under review; to be run on the remote server.

# Methods (keys of run_point.sh): the HadathSQL driver, its ablation variants (each
# removes one optimization; generated by make_ablation_variants.py). See ABLATION.md.
#   driver  HadathSQL driver
#   noidx   HadathSQL driver without indexes
#   mean    HadathSQL driver without summed centroids (running means, still indexed)
#   noprep  HadathSQL driver without prepared statements
#   noopt   HadathSQL driver without all three (combined effect of the optimizations)
METHODS=driver,noidx,mean,noprep,noopt

SETTINGS="synthetic_tweets synthetic_news"
THRESHOLDS="0 0.2 0.4 0.6 0.8 1"

# Numbers of documents, doubling from one size to the next, so that the time ratio
# between neighboring sizes shows the growth rate (about 2: linear; about 4: quadratic).
# A method that hits the time limit is not run at larger sizes
# of the same series, so the slow methods drop out early.
SIZES_SYNTHETIC_TWEETS="125 250 500 1000 2000 4000 8000 16000 32000 64000"
SIZES_SYNTHETIC_NEWS="125 250 500 1000 2000 4000 8000 16000"

TIMEOUT=1800      # time limit per run, in seconds (30 minutes)
REPS=3            # runs per point; the median is reported
REP_MAX=60        # a run of REP_MAX seconds or more is not repeated

PREFIX=results_ablation_
