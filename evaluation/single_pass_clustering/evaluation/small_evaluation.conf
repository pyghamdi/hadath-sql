# Configuration of the small driver comparisons of 2026-10-18 to 2026-10-20 (read by
# sweep.sh), kept to reproduce them (those runs used the setting names tweets and news). Select the drivers and result files with METHODS
# and PREFIX, e.g.  METHODS=d1,sum PREFIX=results_basic_summed_ bash sweep.sh small_evaluation.conf
METHODS=d1,sum,sumidx,sumidxp,driver,d2
SETTINGS="synthetic_tweets synthetic_news"
THRESHOLDS="0 0.2 0.5 0.7 1"
SIZES_SYNTHETIC_TWEETS="200 400 600 800 1000"
SIZES_SYNTHETIC_NEWS="200 400 600 800 1000"
TIMEOUT=300
REPS=3
REP_MAX=60
PREFIX=results_drivers_
