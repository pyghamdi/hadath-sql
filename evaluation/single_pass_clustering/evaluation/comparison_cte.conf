# Evaluation 2 (COMPARISON.md): the Standard SQL CTE against the HadathSQL driver (read
# by sweep.sh), on smaller data than the ablation (ABLATION.md), since the CTE is far slower: in the light run it took
# 25-75 s at 1,000 tweets and about 5 minutes (or more) at 200 news documents.
# The HadathSQL driver (driver) runs at the same sizes, as the comparison and the reference
# of the correctness check; it takes seconds.
METHODS=cte-standard,driver

SETTINGS="synthetic_tweets synthetic_news"
THRESHOLDS="0 0.2 0.4 0.6 0.8 1"

SIZES_SYNTHETIC_TWEETS="100 200 400 800 1600 3200"
SIZES_SYNTHETIC_NEWS="25 50 100 200 400"

TIMEOUT=1800      # time limit per run, in seconds (30 minutes)
REPS=3            # runs per point; the median is reported
REP_MAX=60        # a run of REP_MAX seconds or more is not repeated

PREFIX=results_comparison_cte_
